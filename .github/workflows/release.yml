# Builds Outriced on a Windows runner and attaches the packaged zip to a GitHub
# Release. Triggered by pushing a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Also runnable by hand from the Actions tab, which builds and uploads the zip as
# a workflow artifact without creating a release -- useful for checking the
# pipeline without publishing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The binaries are not in the repository; both are fetched the same way a
      # developer would fetch them locally, so CI exercises the documented path.
      - name: Fetch ffmpeg
        run: powershell -ExecutionPolicy Bypass -File tools/fetch_ffmpeg.ps1

      - name: Fetch libmpv
        run: powershell -ExecutionPolicy Bypass -File tools/fetch_mpv.ps1

      # Diagnostics first: a generator or toolchain mismatch is otherwise a bare
      # "could not find any instance of Visual Studio" with nothing to compare against.
      - name: Toolchain info
        run: |
          cmake --version
          cmake --help | Select-String 'Visual Studio'

      # No -G on purpose. Pinning "Visual Studio 17 2022" breaks the moment the
      # runner image ships a different Visual Studio, which is exactly what
      # happened. CMake picks the newest one installed; -A still selects x64.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: powershell -ExecutionPolicy Bypass -File tools/package.ps1

      # Kept even for tag builds: if the release step fails the build is still
      # downloadable rather than lost.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Outriced
          path: dist/Outriced.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Outriced.zip
            dist/Outriced-symbols.zip
          generate_release_notes: true
          body: |
            Unzip anywhere and run `outriced.exe`. Nothing to install.

            Bundled: ffmpeg, libmpv, SDL3. See `THIRD-PARTY-NOTICES.md` for
            licensing of the included binaries.
